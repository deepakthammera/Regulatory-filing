name: Update news feed
 
# Runs weekly (Mondays 06:00 UTC) and can be triggered manually.
# Fetches official regulator feeds (FDA, EMA, MHRA, WHO) and commits an updated news.json.
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch: {}     # allows a manual run from the Actions tab
 
permissions:
  contents: write           # needed to commit news.json back to the repo
 
concurrency:
  group: update-news
  cancel-in-progress: false
 
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Fetch feeds and build news.json
        run: node scripts/fetch-news.mjs
 
      - name: Commit changes if news.json changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- news.json; then
            echo "No changes to news.json."
          else
            git add news.json
            git commit -m "chore: weekly news update ($(date -u +'%Y-%m-%d'))"
            git push
          fi
