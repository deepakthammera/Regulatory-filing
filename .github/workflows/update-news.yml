name: Update news feed

# Runs daily (06:17 UTC) and can be triggered manually.
# Fetches industry/regulatory/journal feeds (see scripts/fetch-news.mjs) and commits an updated news.json.
on:
  schedule:
    - cron: "17 6 * * *"  # every day at 06:17 UTC (off the hour: top-of-hour runs are often delayed)
  workflow_dispatch: {}     # allows a manual run from the Actions tab

permissions:
  contents: write           # needed to commit news.json back to the repo

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch feeds and build news.json
        run: node scripts/fetch-news.mjs

      - name: Commit changes if news.json changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- news.json; then
            echo "No changes to news.json."
          else
            git add news.json
            git commit -m "chore: daily news update ($(date -u +'%Y-%m-%d'))"
            git push
          fi
